name: PC Data Pipeline (scheduled)

on:
  schedule:
    - cron: "0 3 */14 * *" # cada 14 días a las 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pc-data-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.13"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python deps (hash-locked)
        run: |
          python -m venv /tmp/pc-venv
          /tmp/pc-venv/bin/pip install --require-hashes -r scripts/requirements.txt

      - name: Install npm deps
        working-directory: pc-quote-builder
        run: npm ci

      - name: Run verification gate
        working-directory: pc-quote-builder
        run: npm run check

      - name: Download datasets (BuildCores, PC Part, DBGPU)
        run: /tmp/pc-venv/bin/python scripts/download_pc_datasets.py

      - name: Build processed data
        working-directory: pc-quote-builder
        run: npm run build:pc-data

      - name: Sync processed data into deployed static assets
        working-directory: pc-quote-builder
        run: npm run sync:pc-data

      - name: Validate artifact contracts
        working-directory: pc-quote-builder
        run: npm run test:artifacts

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
