name: PC Data Pipeline (scheduled)

on:
  schedule:
    - cron: "0 3 */14 * *" # cada 14 días a las 03:00 UTC
  workflow_dispatch: {}

# Build job only needs contents:read; deploy job gets pages + id-token explicitly.
permissions:
  contents: read

concurrency:
  group: pc-data-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: pc-quote-builder/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install Python deps (hash-locked)
        run: |
          python -m venv /tmp/pc-venv
          /tmp/pc-venv/bin/pip install --require-hashes -r scripts/requirements.txt

      - name: Install npm deps
        working-directory: pc-quote-builder
        run: npm ci

      - name: Lint and test
        working-directory: pc-quote-builder
        run: npm run lint && npm run lint:scripts && npm test && npm run test:assurance

      - name: Download datasets (BuildCores, PC Part, DBGPU)
        run: /tmp/pc-venv/bin/python scripts/download_pc_datasets.py

      - name: Build processed data
        working-directory: pc-quote-builder
        run: npm run build:pc-data

      - name: Sync processed data into deployed static assets
        working-directory: pc-quote-builder
        run: npm run sync:pc-data

      - name: Validate artifact contracts
        working-directory: pc-quote-builder
        run: npm run test:artifacts

      - name: Build production site
        working-directory: pc-quote-builder
        run: npm run build

      - name: Prune stale hashed assets
        working-directory: pc-quote-builder
        run: npm run prune:assets

      - name: Assert docs/data matches synced public/data
        working-directory: pc-quote-builder
        run: npx vitest run src/lib/postBuildAssertion.test.js

      - name: Upload production build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site-build
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download production build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site-build
          path: docs/

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
